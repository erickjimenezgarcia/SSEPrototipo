<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Visor</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="/assets/img/ui/sunass_logo.png" type="image/png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin />
  <style>
    html, body, #map { height: 100%; margin: 0 }
    .toolbar {
      position: absolute; z-index: 1000; top: 8px; left: 8px;
      background: #fff; padding: 8px 10px; border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15); font: 12px system-ui, sans-serif;
      display: flex; gap: 6px; align-items: center;
    }
    .toolbar input { padding: 4px 6px }
    .toolbar button { padding: 6px 10px; border-radius: 8px; border: 0; cursor: pointer }
    .help-btn {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      width: 24px; height: 24px; border-radius: 50%;
      background: #005f99; color: #fff; border: 0;
      cursor: pointer; font-weight: bold; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .help-btn:hover { background: #004477; }
    .help-popup {
      display: none; position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 20px; border-radius: 10px;
      box-shadow: 0 4px 12px rgba(0,0,0,.25);
      max-width: 400px; font: 13px system-ui, sans-serif;
      line-height: 1.5; z-index: 2000;
    }
    .help-popup.show { display: block; }
    .help-popup h3 {
      margin-top: 0; color: #005f99;
    }
    .help-popup-close {
      position: absolute; top: 8px; right: 10px;
      background: none; border: 0; font-size: 20px;
      cursor: pointer; color: #666; line-height: 1;
    }
    .help-popup-close:hover { color: #000; }
    .zoom-hint { background:#fff;padding:6px 8px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);font:12px/1.2 sans-serif; }
    .corner {
      position: absolute;
      z-index: 1000;
      bottom: 12px;
      pointer-events: none; 
      opacity: .95;
    }

    .corner img {
      display: block;
      height: auto;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.35));
    }

    .corner-left img {
      width: 120px;       
    }

    .corner-right img {
      width: 80px; 
    }

    .corner-left  { left: 12px; }
    .corner-right { right: 12px; }

    .sector-label {
      background: transparent;
      border: none;
    }

    .sector-label > div {
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
      color: #005f99;
      text-shadow: 0 0 2px rgba(255,255,255,0.95), 0 0 6px rgba(255,255,255,0.95);
      pointer-events: none;
    }

    .faucet-new { filter: hue-rotate(95deg) saturate(2.4) brightness(1.05); }
    .faucet-old { filter: none; }

    .corner-top-right {
      position: absolute;
      z-index: 1100;
      top: 12px;
      right: 60px;
      pointer-events: auto; /* ✅ permitir click */
    }

    .corner-top-right a {
      display: inline-block;
    }

    .corner-top-right img {
      width: 120px;         /* ajusta a gusto */
      height: auto;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.35));
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .corner-left img {
      width: 60px;       
      }

      .corner-right img {
        width: 40px; 
      }

      .corner-top-right img {
      width: 80px;
    }
    }

    
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="toolbar">
    <label>Desde: <input id="d-start" type="date"></label>
    <label>Hasta: <input id="d-end" type="date"></label>
    <button id="apply">Aplicar</button>

    <label style="margin-left:8px;">
      <input type="checkbox" id="toggle-area" checked>
      Área de sectores
    </label>

    <span id="status"></span>
    
    <button class="help-btn" id="help-btn" title="Ayuda">?</button>
  </div>

  <div class="corner-top-right">
    <a
      href="https://geosunass.sunass.gob.pe/gisportal/apps/dashboards/955453e5430f4224b8ecc74e2e614e5e"
      target="_blank"
      rel="noopener noreferrer"
      title="Yakunectados"
    >
      <img src="/assets/img/ui/YakunectadoLogo.png" alt="Yakunectado">
    </a>
  </div>

  <div class="help-popup" id="help-popup">
    <button class="help-popup-close" id="help-close">×</button>
    <h3>¿Qué significa esto?</h3>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
  </div>

  <div class="corner corner-left">
    <img src="/assets/img/ui/camiyaku.png" alt="Marca izquierda">
  </div>
  <div class="corner corner-right">
    <img src="/assets/img/ui/sunass_logo2.png" alt="Marca derecha">
  </div>

  <div style="
    position: fixed;
    bottom: 4px;
    left: 8px;
    font-size: 10px;
    color: #555;
    z-index: 1000;
    background: rgba(255,255,255,0.8);
    padding: 2px 6px;
    border-radius: 4px;
  ">
    © OpenStreetMap contributors
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
  <script>
  // === Config ===
  const MIN_ZOOM = 8;
  const POINT_RADIUS = 3;
  const MAX_POINTS = 20000;

  function parseDateInputLocal(value) {
  // value = "YYYY-MM-DD"
  if (!value) return null;
  const [y, m, d] = value.split('-').map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d); // esto es LOCAL, sin UTC raro
}

  const faucetIconOld = L.icon({
    iconUrl: '/assets/img/icons/faucet.svg',
    iconSize: [18, 18],
    iconAnchor: [9, 9],
    popupAnchor: [0, -10],
    className: 'faucet-icon faucet-old',
  });

  const faucetIconNew = L.icon({
    iconUrl: '/assets/img/icons/faucet.svg',
    iconSize: [18, 18],
    iconAnchor: [9, 9],
    popupAnchor: [0, -10],
    className: 'faucet-icon faucet-new',
  });

  // Util: fechas (America/Lima, sin librerías)
  const tzOffsetMinutes = 5 * 60; // Lima -05:00 (fijo)
  const todayLocal = () => {
    const now = new Date();
    // Ajustamos a Lima restando el offset del sistema y aplicando -05:00
    const utc = now.getTime() + now.getTimezoneOffset()*60000;
    return new Date(utc - tzOffsetMinutes*60000);
  };
  const yyyymmdd = (d) => d.toISOString().slice(0,10);
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const endOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23,59,59,999);

  // Mapa + renderer
  const map = L.map('map',{attributionControl: false}).setView([-9.2, -75.0], 6);
  map.zoomControl.setPosition('topright');
  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
    }
  ).addTo(map);
  const canvasRenderer = L.canvas({ padding: 0.5 });
  const pointsLayer = L.layerGroup([], { renderer: canvasRenderer }).addTo(map);

  // Estado
  let latestData = [];
  const NEW_TTL_MS = 15 * 60 * 1000;
  const firstSeenById = new Map();     // id -> timestamp
  let baselineLoaded = false; 
  let es = null; // EventSource activo (si aplica)
  const statusEl = document.getElementById('status');

  let totalNewSinceLoad = 0;
  const newIdsSinceLoad = new Set();

  let areaLayer = null;
  let areaLabelsLayer;
  const toggleArea = document.getElementById('toggle-area');

  function setStatus(text) {
    statusEl.textContent = text || '';
  }

  function resetNewTracking() {
    baselineLoaded = false;
    firstSeenById.clear();
  }


  // Render de puntos con filtro por viewport
  function renderPoints() {
    pointsLayer.clearLayers();
    const zoom = map.getZoom();
    if (zoom < MIN_ZOOM) return;

    const bounds = map.getBounds();
    let drawn = 0;

    const nowMs = Date.now();
    for (const item of latestData) {
      if (drawn >= MAX_POINTS) break;
      const lat = Number(item.lat);
      const lng = Number(item.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
      if (!bounds.contains([lat, lng])) continue;

      const id = item?.id;

      const firstSeen = (id != null) ? firstSeenById.get(id) : null;
      const isToday = isTodayInLima(item?.fecha);
      const isNew = isToday && (firstSeen != null) && ((nowMs - firstSeen) < NEW_TTL_MS);

      L.marker([lat, lng], {
        icon: isNew ? faucetIconNew : faucetIconOld,
        keyboard: false,
        interactive: false,
        pane: 'markerPane',
      }).addTo(pointsLayer);

      drawn++;
    }
  }
  map.on('zoomend moveend', renderPoints);

  // Cierra SSE si está abierto
  function closeSSE() {
    if (es) {
      es.close();
      es = null;
    }
  }

  // Consulta puntual (sin SSE)
  async function oneShotQuery(startISO, endISO) {
    closeSSE();
    setStatus('Consultando…');
    const url = `/query?start=${encodeURIComponent(startISO)}&end=${encodeURIComponent(endISO)}`;
    const res = await fetch(url);
    if (!res.ok) {
      setStatus('Error en consulta');
      return;
    }
    const data = await res.json();
    latestData = Array.isArray(data) ? data : [];
    setStatus(`Mostrando ${latestData.length} puntos`);
    renderPoints();
  }

  async function loadAreaDrenajeLayer() {
    try {
      const res = await fetch('/api/areaDrenaje');
      if (!res.ok) {
        console.error('Error al cargar área de drenaje', res.status);
        return;
      }
      const geojson = await res.json();

      // Si ya existía, la quitamos antes de crearla de nuevo
      if (areaLayer) {
        map.removeLayer(areaLayer);
      }

      areaLayer = L.geoJSON(geojson, {
        style: function () {
          return {
            color: '#005f99',   // borde
            weight: 1.5,        // grosor del borde
            fillOpacity: 0,     // SIN relleno, no tapa los puntos
          };
        },
        interactive: false,     // que no capture clics (para que sea "de fondo"
      }).addTo(map);
    } catch (err) {
      console.error('Error fetch área drenaje', err);
    }
  }

const MIN_ZOOM_LABELS = 13;
const FULL_LABELS_ZOOM = 15;   // desde aquí mostramos TODOS
const MIN_PIXEL_DIST = 80;

function updateSectorLabelsVisibility() {
  if (!areaLabelsLayer) return;

  const z = map.getZoom();

  // 1) debajo del mínimo: no mostrar
  if (z < MIN_ZOOM_LABELS) {
    if (map.hasLayer(areaLabelsLayer)) map.removeLayer(areaLabelsLayer);
    return;
  }

  // 2) asegurar que esté agregada para poder filtrar
  if (!map.hasLayer(areaLabelsLayer)) map.addLayer(areaLabelsLayer);

  // 3) si ya estás en zoom alto: mostrar todo
  if (z >= FULL_LABELS_ZOOM) {
    areaLabelsLayer.eachLayer((m) => {
      if (m.getElement) {
        const el = m.getElement();
        if (el) el.style.display = '';
      }
    });
    return;
  }

  // 4) zoom intermedio: mostrar solo algunos (sin solaparse)
  const shown = []; // puntos ya mostrados en px

  areaLabelsLayer.eachLayer((m) => {
    const ll = m.getLatLng?.();
    const el = m.getElement?.();
    if (!ll || !el) return;

    const pt = map.latLngToContainerPoint(ll);

    // si está muy cerca de uno ya mostrado -> ocultar
    let ok = true;
    for (const s of shown) {
      const dx = pt.x - s.x;
      const dy = pt.y - s.y;
      if ((dx*dx + dy*dy) < (MIN_PIXEL_DIST * MIN_PIXEL_DIST)) {
        ok = false;
        break;
      }
    }

    el.style.display = ok ? '' : 'none';
    if (ok) shown.push(pt);
  });
}


async function loadAreaSectoresLayer() {
  try {
    const res = await fetch('/api/areaSectores');
    if (!res.ok) {
      console.error('Error al cargar área sectores', res.status);
      return;
    }

    const geojson = await res.json();
    console.log("geojson.type:", geojson?.type);
    console.log("features:", geojson?.features?.length);

    const f0 = geojson?.features?.[0];
    console.log("feature[0] keys:", f0 ? Object.keys(f0) : null);
    console.log("feature[0].properties keys:", f0?.properties ? Object.keys(f0.properties) : null);
    console.log("feature[0].properties sample:", f0?.properties);
    console.log("feature[0].geometry type:", f0?.geometry?.type);

    // limpiar capas previas
    if (areaLayer) map.removeLayer(areaLayer);
    if (areaLabelsLayer) map.removeLayer(areaLabelsLayer);

    areaLabelsLayer = L.layerGroup(); // ojo: NO la agregues todavía

    areaLayer = L.geoJSON(geojson, {
      style: () => ({
        color: '#005f99',
        weight: 1.5,
        fillOpacity: 0,
      }),
      interactive: false,

      onEachFeature: (feature, layer) => {
        const nombre = feature?.properties?.sector;
        if (!nombre) return;

        // Si no hay geometría, no intentes centrar
        if (!feature?.geometry) return;

        // Bounds seguros
        const bounds = layer.getBounds?.();
        if (!bounds || !bounds.isValid || !bounds.isValid()) return;

        const center = bounds.getCenter();

        L.marker(center, {
          interactive: false,
          icon: L.divIcon({
            className: "sector-label",
            html: `<div>${nombre}</div>`,
            iconSize: null,
          }),
        }).addTo(areaLabelsLayer);
      }

    }).addTo(map);

    // 1) aplica visibilidad inicial
    updateSectorLabelsVisibility();

    // 2) engancha el listener (solo una vez)
    if (!map._labelsZoomHandlerAdded) {
      map.on('zoomend', updateSectorLabelsVisibility);
      map._labelsZoomHandlerAdded = true;
    }

  } catch (err) {
    console.error('Error fetch área sectores', err);
  }
}


  toggleArea.addEventListener('change', (e) => {
    if (!areaLayer) {
      // Si aún no está cargada y el usuario la enciende, la cargamos
      if (e.target.checked) {
        loadAreaSectoresLayer();
      }
      return;
    }

    if (e.target.checked) {
      areaLayer.addTo(map);
    } else {
      map.removeLayer(areaLayer);
    }
  });

  function isTodayInLima(fechaIso) {
    if (!fechaIso) return false;

    const d = new Date(fechaIso);           // respeta el -05:00 si viene en ISO
    const hoy = todayLocal();               // ya está "en Lima"
    return yyyymmdd(d) === yyyymmdd(hoy);   // compara solo YYYY-MM-DD
  }

  // Streaming (SSE)
  function startSSE(startISO, endISO) {
    closeSSE();
    resetNewTracking();
    const url = `/stream?start=${encodeURIComponent(startISO)}&end=${encodeURIComponent(endISO)}`;
    es = new EventSource(url);
    es.addEventListener('open', () => setStatus('Streaming activo…'));
    es.addEventListener('error', () => setStatus('SSE desconectado'));
    es.addEventListener('update', (event) => {
      let data;
      try { data = JSON.parse(event.data); } catch { return; }

      const arr = Array.isArray(data) ? data : [];
      const now = Date.now();

      const idsInThisUpdate = new Set();
      let newCount = 0;

      // 1) Baseline: primera vez => todo ROJO (no cuenta como "nuevo")
      if (!baselineLoaded) {
        for (const it of arr) {
          const id = it?.id;
          if (id == null) continue;
          idsInThisUpdate.add(id);

          // lo marcamos como visto "hace más de 15 min" para que salga rojo
          firstSeenById.set(id, now - NEW_TTL_MS - 1000);
        }
        baselineLoaded = true;
        newCount = 0;
      } else {
        // 2) Luego: lo que aparezca por primera vez => VERDE por 15 min
        // ✅ y además sumar acumulado SOLO si es de HOY
        for (const it of arr) {
          const id = it?.id;
          if (id == null) continue;
          idsInThisUpdate.add(id);

          const isToday = isTodayInLima(it?.fecha);
          if (!isToday) continue;

          if (!firstSeenById.has(id)) {
            firstSeenById.set(id, now); // empieza a contar 15 min
            newCount++;

            // ✅ acumulado desde que entró (no se repite)
            if (!newIdsSinceLoad.has(id)) {
              newIdsSinceLoad.add(id);
              totalNewSinceLoad++;
            }
          }
        }
      }

      // 3) Limpieza: evita que el Map crezca infinito
      // (si un id deja de venir, lo borramos)
      for (const id of firstSeenById.keys()) {
        if (!idsInThisUpdate.has(id)) firstSeenById.delete(id);
      }

      latestData = arr;

      const hora = new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
      setStatus(`Streaming: ${latestData.length} | Nuevos: ${totalNewSinceLoad} (+${newCount})`);

      renderPoints();
    });
    es.addEventListener('complete', () => {
      // El backend puede cerrar si el rango no incluye hoy (seguro extra)
      setStatus('Rango histórico (completado)');
      closeSSE();
    });
  }

  // Lógica: elegir SSE o consulta según rango
  async function loadRange(startDate, endDate) {
    const startISO = new Date(startDate).toISOString();
    const endISO = new Date(endDate).toISOString();
    const hoy = startOfDay(todayLocal());      // 00:00 de hoy Lima
    const incHoy = endDate >= hoy;             // el rango incluye hoy

    if (incHoy) {
      startSSE(startISO, endISO);
    } else {
      await oneShotQuery(startISO, endISO);
    }
  }

  // UI fechas
  const inputStart = document.getElementById('d-start');
  const inputEnd = document.getElementById('d-end');
  const btnApply = document.getElementById('apply');

  // Por defecto: AYER 00:00 → HOY ahora
  const hoy = todayLocal();
  const ayer = new Date(hoy.getTime() - 24*60*60*1000);
  inputStart.value = yyyymmdd(hoy);
  inputEnd.value = yyyymmdd(hoy);

  btnApply.addEventListener('click', () => {
    const s = parseDateInputLocal(inputStart.value) || hoy;
    const e = parseDateInputLocal(inputEnd.value) || hoy;

    const start = startOfDay(s);

    const eIsToday = yyyymmdd(e) === yyyymmdd(hoy);
    const end = eIsToday ? new Date(hoy) : endOfDay(e);

    loadRange(start, end);
  });

  // Carga inicial
  (function initLoad() {
    const start = startOfDay(hoy);
    const end = new Date(hoy); // ahora → para incluir hoy y activar SSE
    loadRange(start, end);
    if (toggleArea.checked) {
      loadAreaSectoresLayer();
    }
  })();

  // Popup de ayuda
  const helpBtn = document.getElementById('help-btn');
  const helpPopup = document.getElementById('help-popup');
  const helpClose = document.getElementById('help-close');

  helpBtn.addEventListener('click', () => {
    helpPopup.classList.toggle('show');
  });

  helpClose.addEventListener('click', () => {
    helpPopup.classList.remove('show');
  });

  // Cerrar el popup si se hace click fuera de él
  document.addEventListener('click', (e) => {
    if (!helpPopup.contains(e.target) && e.target !== helpBtn) {
      helpPopup.classList.remove('show');
    }
  });

  </script>
</body>
</html>
